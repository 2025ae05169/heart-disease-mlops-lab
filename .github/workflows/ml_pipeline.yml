name: Heart Disease ML CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: python -m pytest tests -v --junitxml=pytest-results.xml
      - name: Train and compare models
        run: python -m src.train --data data/heart_cleaned.csv --output ci_artifacts
      - name: Upload training and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-ci-results
          path: |
            ci_artifacts/
            pytest-results.xml
          if-no-files-found: warn
